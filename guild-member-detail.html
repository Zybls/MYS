<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #0b0b12; --bg-card: #15151f; --bg-card2: #1c1c2a;
    --border: #2a2a3e; --gold: #f59e0b; --gold-dim: #b45309;
    --text: #d8d8e8; --text-dim: #8892a8; --text-bright: #f1f5f9;
    --radius: 14px;
}
[data-theme="light"] { --bg:#f5f5f7; --bg-card:#fff; --bg-card2:#f8f8fa; --border:#e0e0e8; --gold:#d97706; --text:#1a1a2e; --text-dim:#5a5a6e; --text-bright:#0a0a15; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

/* 导航 */
.guild-nav { position: sticky; top: 0; z-index: 100; background: rgba(11,11,18,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 10px 20px; }
.guild-nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.guild-nav-left { display: flex; align-items: center; gap: 12px; }
.guild-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); }
.guild-nav-name { font-size: 16px; font-weight: 700; color: var(--gold); }
.guild-nav-slogan { font-size: 11px; color: var(--text-dim); }
.guild-nav-links { display: flex; gap: 20px; }
.guild-nav-link { color: var(--text); text-decoration: none; font-size: 14px; transition: color 0.2s; }
.guild-nav-link:hover { color: var(--gold); }
.nav-right { display: flex; align-items: center; gap: 10px; }
.nav-icon-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.nav-icon-btn:hover { border-color: var(--gold); transform: scale(1.1); }
.back-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
.back-btn:hover { border-color: var(--gold); color: var(--gold); }

/* 主内容 */
.container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }

/* 成员头部 */
.member-header { display: flex; align-items: center; gap: 24px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; margin-bottom: 24px; position: relative; overflow: hidden; }
.member-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), transparent); }
.member-avatar-lg { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dim)); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: #1a1a2e; flex-shrink: 0; border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(245,158,11,0.3); }
.member-header-info { flex: 1; }
.member-name-lg { font-size: 28px; font-weight: 800; color: var(--text-bright); margin-bottom: 6px; }
.member-title-lg { font-size: 14px; color: var(--gold); margin-bottom: 10px; }
.member-badges-lg { display: flex; gap: 8px; flex-wrap: wrap; }
.member-badge-lg { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.badge-crown { background: linear-gradient(135deg,#fbbf24,#f59e0b); color: #78350f; }
.badge-s { background: linear-gradient(135deg,#a855f7,#7c3aed); color: #fff; }
.badge-mvp { background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; }
.badge-king { background: linear-gradient(135deg,#06b6d4,#0891b2); color: #fff; }
.badge-shield { background: linear-gradient(135deg,#3b82f6,#2563eb); color: #fff; }
.badge-war { background: linear-gradient(135deg,#f97316,#ea580c); color: #fff; }

/* 数据卡片 */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; transition: all 0.2s; }
.stat-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.stat-value-lg { font-size: 28px; font-weight: 800; color: var(--gold); margin-bottom: 4px; }
.stat-label-lg { font-size: 12px; color: var(--text-dim); }

/* 详情区块 */
.detail-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.detail-title { font-size: 16px; font-weight: 700; color: var(--gold); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.detail-row:last-child { border-bottom: none; }
.detail-label { color: var(--text-dim); }
.detail-value { color: var(--text-bright); font-weight: 600; }

/* 战绩时间线 */
.battle-timeline { position: relative; padding-left: 24px; }
.battle-timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.battle-item { position: relative; padding-bottom: 20px; }
.battle-item::before { content: ''; position: absolute; left: -22px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); border: 2px solid var(--bg); }
.battle-item.win::before { background: #22c55e; }
.battle-item.lose::before { background: #ef4444; }
.battle-date { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.battle-title { font-size: 14px; font-weight: 600; color: var(--text-bright); margin-bottom: 2px; }
.battle-desc { font-size: 13px; color: var(--text-dim); }

/* 响应式 */
@media (max-width: 768px) {
    .guild-nav-links { display: none; }
    .member-header { flex-direction: column; text-align: center; padding: 20px; }
    .member-badges-lg { justify-content: center; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .member-name-lg { font-size: 22px; }
}

/* 移动端导航栏横向滚动 */
@media (max-width: 768px) {
  .nav-inner { overflow-x: auto !important; overflow-y: hidden !important; flex-wrap: nowrap !important; -webkit-overflow-scrolling: touch !important; scrollbar-width: none !important; }
  .nav-inner::-webkit-scrollbar { display: none !important; }
  .nav-links { flex-wrap: nowrap !important; flex-shrink: 0 !important; }
  .nav-link { white-space: nowrap !important; flex-shrink: 0 !important; }
}

// 默认成员
const DEFAULT_MEMBER = '天涯丶醉摇摆';

function getMemberName() {
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  return name && MEMBER_DB[name] ? name : DEFAULT_MEMBER;
}

function renderMember(name) {
  const m = MEMBER_DB[name];
  if (!m) return;
  
  let html = `
    <div class="member-header">
      <div class="member-avatar-lg">${m.avatar}</div>
      <div class="member-header-info">
        <div class="member-name-lg">${name}</div>
        <div class="member-title-lg">${m.title}</div>
        <div class="member-badges-lg">
          ${m.badges.map(b => `<span class="member-badge-lg ${b[0]}">${b[1]}</span>`).join('')}
        </div>
      </div>
    </div>
    
    <div class="stats-grid">
      ${m.stats.map(s => `<div class="stat-card"><div class="stat-value-lg">${s[0]}</div><div class="stat-label-lg">${s[1]}</div></div>`).join('')}
    </div>
    
    <div class="detail-section">
      <div class="detail-title">📋 基本信息</div>
      ${m.info.map(i => `<div class="detail-row"><span class="detail-label">${i[0]}</span><span class="detail-value">${i[1]}</span></div>`).join('')}
    </div>
    
    <div class="detail-section">
      <div class="detail-title">⚔️ 战绩记录</div>
      <div class="battle-timeline">
        ${m.battles.map(b => `
          <div class="battle-item ${b.type}">
            <div class="battle-date">${b.date}</div>
            <div class="battle-title">${b.title}</div>
            <div class="battle-desc">${b.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  
  document.getElementById('memberContent').innerHTML = html;
  document.title = name + ' - 天涯若比邻';
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.querySelector('.nav-icon-btn').textContent = next === 'dark' ? '🌙' : '☀️';
}

// 初始化
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.addEventListener('DOMContentLoaded', function() {
  document.querySelector('.nav-icon-btn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
  renderMember(getMemberName());
});

// 注册Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
