<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>资料库 - 天涯若比邻公会</title>
<style>
:root{--bg:#0f0f1a;--bg-card:#1a1a2e;--bg-card2:#252540;--border:#2d2d4a;--text:#e8e8f0;--text-dim:#8888aa;--purple:#a78bfa;--blue:#60a5fa;--red:#f87171;--green:#34d399;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:80px;}
.header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header h1{font-size:18px;font-weight:700;}
.header .search-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;}
.tab-bar{display:flex;gap:4px;padding:10px 16px;background:var(--bg-card);border-bottom:1px solid var(--border);overflow-x:auto;}
.tab-btn{padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;background:transparent;border:none;color:var(--text-dim);white-space:nowrap;transition:all 0.2s;}
.tab-btn.active{background:rgba(167,139,250,0.15);color:var(--purple);font-weight:600;}
.tab-panel{display:none;padding:16px;}
.tab-panel.active{display:block;}
.catalog-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.catalog-search-box{position:relative;flex:1;min-width:200px;max-width:360px;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:0.5;}
.catalog-search-input{width:100%;padding:9px 12px 9px 36px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;}
.catalog-search-input:focus{border-color:var(--blue);}
.catalog-filter-group{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);}
.filter-btn:hover{border-color:var(--blue);}
.filter-btn.active{background:rgba(96,165,250,0.15);border-color:var(--blue);color:var(--blue);font-weight:600;}
.catalog-count{margin-left:auto;font-size:12px;color:var(--text-dim);white-space:nowrap;}
.engraving-grid,.skill-grid,.rune-grid,.armor-grid,.pet-grid,.build-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.engraving-card,.skill-card,.rune-card,.armor-card,.pet-card,.build-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:all 0.2s;display:block;}
.engraving-card:hover,.skill-card:hover,.rune-card:hover,.armor-card:hover,.pet-card:hover,.build-card:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:0 4px 16px rgba(167,139,250,0.15);}
.engraving-icon,.skill-icon,.rune-icon,.armor-icon,.pet-icon,.build-icon{width:56px;height:56px;margin:0 auto 8px;border-radius:10px;background:var(--bg-card2);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px;}
.engraving-icon img,.skill-icon img,.rune-icon img,.armor-icon img,.pet-icon img{width:100%;height:100%;object-fit:contain;}
.engraving-name,.skill-name,.rune-name,.armor-name,.pet-name,.build-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.engraving-class,.skill-class,.rune-class,.armor-class,.pet-class,.build-class{font-size:10px;padding:2px 8px;border-radius:4px;display:inline-block;margin:2px;}
.build-tags{margin-top:4px;}
.build-tag{font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(96,165,250,0.1);color:#60a5fa;display:inline-block;margin:1px;}
.pet-card-tags{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.pet-tag{font-size:10px;padding:2px 6px;border-radius:4px;}
.pet-quality{background:rgba(251,191,36,0.15);color:#fbbf24;}
.pet-bond{background:rgba(167,139,250,0.15);color:#a78bfa;}
.modal-kv-list{background:var(--bg-card2);border-radius:8px;padding:10px 14px;}
.modal-kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);}
.modal-kv:last-child{border-bottom:none;}
.modal-kv-label{font-size:13px;color:var(--text-dim);}
.modal-kv-value{font-size:13px;color:var(--text);font-weight:600;}
.cls-野蛮人{background:rgba(248,113,113,0.15);color:#f87171;}
.cls-秘法师{background:rgba(96,165,250,0.15);color:#60a5fa;}
.cls-游侠{background:rgba(52,211,153,0.15);color:#34d399;}
.cls-通用{background:rgba(148,163,184,0.15);color:#94a3b8;}
.skill-cat,.rune-cat,.armor-part,.armor-quality,.pet-quality{font-size:10px;padding:1px 6px;border-radius:3px;display:inline-block;margin:2px;background:rgba(167,139,250,0.1);color:#a78bfa;}
.engraving-desc-preview,.skill-desc-preview,.rune-desc-preview,.armor-desc-preview,.pet-desc-preview,.build-desc-preview{font-size:10px;color:var(--text-dim);margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.empty-state{text-align:center;padding:40px 20px;}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-content{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;position:relative;animation:modalIn 0.25s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1)}}
.modal-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.1);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;z-index:1;}
.modal-body{padding:24px;}
.modal-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.modal-icon{width:72px;height:72px;border-radius:14px;background:var(--bg-card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.modal-icon img{width:100%;height:100%;object-fit:contain;}
.modal-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px;}
.modal-meta{display:flex;gap:8px;flex-wrap:wrap;}
.modal-section{margin-bottom:16px;}
.modal-section-title{font-size:12px;font-weight:600;color:var(--purple);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
.modal-section-content{font-size:14px;color:var(--text);line-height:1.8;background:var(--bg-card2);padding:12px 14px;border-radius:8px;}
.modal-detail-img{width:100%;border-radius:10px;margin-top:8px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:99;}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-dim);text-decoration:none;font-size:11px;padding:4px 12px;}
.bottom-nav a.active{color:var(--purple);}
.bottom-nav .icon{font-size:20px;}
@media(max-width:768px){
  .engraving-grid,.skill-grid,.rune-grid,.armor-grid,.pet-grid,.build-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
  .engraving-icon,.skill-icon,.rune-icon,.armor-icon,.pet-icon{width:48px;height:48px;}
  .engraving-name,.skill-name,.rune-name,.armor-name,.pet-name{font-size:12px;}
  .catalog-toolbar{flex-direction:column;align-items:stretch;}
  .catalog-search-box{max-width:100%;}
  .catalog-count{margin-left:0;text-align:center;}
  .modal-body{padding:16px;}
  .modal-header{flex-direction:column;text-align:center;}
}
</style>
</head>
<body>

<div class="header">
  <h1>&#128218; 资料库</h1>
  <button class="search-btn" onclick="alert('搜索功能开发中')">&#128269;</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="build" onclick="switchTab('build')">配装</button>
  <button class="tab-btn" data-tab="engraving" onclick="switchTab('engraving')">刻印</button>
  <button class="tab-btn" data-tab="skill" onclick="switchTab('skill')">技能</button>
  <button class="tab-btn" data-tab="rune" onclick="switchTab('rune')">遗物</button>
  <button class="tab-btn" data-tab="armor" onclick="switchTab('armor')">暗能</button>
  <button class="tab-btn" data-tab="pet" onclick="switchTab('pet')">侍从</button>
</div>

<!-- ===== 配装Tab ===== -->
<div class="tab-panel" id="panel-build">
  <div class="catalog-toolbar">
    <div class="catalog-search-box">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="buildSearch" placeholder="搜索配装名称/流派..." class="catalog-search-input">
    </div>
    <div class="catalog-filter-group" id="buildFilter">
      <button class="filter-btn active" data-filter="all" onclick="filterBuilds('all')">全部</button>
      <button class="filter-btn" data-filter="野蛮人" onclick="filterBuilds('野蛮人')">野蛮人</button>
      <button class="filter-btn" data-filter="秘法师" onclick="filterBuilds('秘法师')">秘法师</button>
      <button class="filter-btn" data-filter="游侠" onclick="filterBuilds('游侠')">游侠</button>
    </div>
    <div class="catalog-count" id="buildCount">18 套配装</div>
  </div>
  <div class="build-grid" id="buildGrid"></div>
  <div class="empty-state" id="buildEmpty" style="display:none;">
    <div style="font-size:40px;margin-bottom:8px;">&#128269;</div>
    <div style="color:var(--text-dim);font-size:13px;">没有找到匹配的配装</div>
  </div>
</div>

<!-- ===== 刻印Tab ===== -->
<div class="tab-panel" id="panel-engraving">
  <div class="catalog-toolbar">
    <div class="catalog-search-box">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="engravingSearch" placeholder="搜索刻印名称/效果..." class="catalog-search-input">
    </div>
    <div class="catalog-filter-group" id="engravingFilter">
      <button class="filter-btn active" data-filter="all" onclick="filterEngravings('all')">全部</button>
      <button class="filter-btn" data-filter="野蛮人" onclick="filterEngravings('野蛮人')">野蛮人</button>
      <button class="filter-btn" data-filter="秘法师" onclick="filterEngravings('秘法师')">秘法师</button>
      <button class="filter-btn" data-filter="通用" onclick="filterEngravings('通用')">通用</button>
    </div>
    <div class="catalog-count" id="engravingCount">48 个刻印</div>
  </div>
  <div class="engraving-grid" id="engravingGrid"></div>
  <div class="empty-state" id="engravingEmpty" style="display:none;">
    <div style="font-size:40px;margin-bottom:8px;">&#128269;</div>
    <div style="color:var(--text-dim);font-size:13px;">没有找到匹配的刻印</div>
  </div>
</div>

<noscript>
  <div style="padding:20px;">
    <h2>刻印图鉴（48个）</h2>
    <ul>
      <li>超级闪光 - 野蛮人 - 造成暴击伤害时，施放超级闪光，每5秒最多触发1次。</li>
      <li>腐化浪潮 - 野蛮人 - 击中处于持续伤害状态的敌人时施放一阵毒液，对大范围内的敌人施加腐化每5秒最多触发1次。</li>
      <li>冠军拳套 - 野蛮人 - 核心技能击中时有20%概率施放冠军之拳，每5秒最多触发1次；每次施展掌控或终极技能时获得蓄力。</li>
      <li>巨人壁垒 - 野蛮人 - 每隔5秒，下一次基础技能造成10倍伤害，同时获得40%最大生命值的护盾，持续5秒。</li>
      <li>烈日光环 - 野蛮人 - 施加持续伤害类效果时展开烈日光环，每5秒最多触发1次。</li>
      <li>流星 - 野蛮人 - 核心技能造成伤害时有30%概率施放流星，每5秒最多触发1次。</li>
      <li>熔岩爆裂 - 野蛮人 - 造成元素伤害时有50%概率施放熔岩奔涌，每5秒最多触发1次。</li>
      <li>虚空裂口 - 野蛮人 - 施放终极技能或掌控技能时施放虚空裂口，每5秒最多触发1次。</li>
      <li>以太光束 - 野蛮人 - 施放核心技能时施放以太光束，每5秒最多触发1次。</li>
      <li>战争印记 - 野蛮人 - 你的基础技能有30%概率施加2秒眩晕和10秒战争印记。效果结束前无法重复施加。</li>
      <li>震耳噪音 - 野蛮人 - 施放掌控技能后发出一阵怒吼，对周围所有敌人造成1000%攻击力的元素伤害和失衡，每5秒最多触发1次。</li>
      <li>征服者 - 野蛮人 - 施展核心技能时有50%概率获得征服者，每5秒最多触发1次。</li>
      <li>保护祝福 - 秘法师 - 生命值首次降低至40%时，获得最大生命值100%的护盾，最多持续6秒。</li>
      <li>复仇 - 秘法师 - 受到大于等于最大生命值10%的伤害时，你的核心技能在接下来的2秒内伤害翻倍，这个效果每5秒最多触发1次。</li>
      <li>海浪之歌 - 秘法师 - 造成伤害时有10%概率施放海浪攻击，造成100%攻击力的元素伤害并施加寒冷，每10秒最多触发1次。</li>
      <li>回春 - 秘法师 - 核心刻印效果触发时，在3秒内持续恢复总计40%最大生命值。</li>
      <li>强风射击 - 秘法师 - 击中敌人时有20%概率施展强风射击，对大范围敌人造成50%攻击力的元素伤害、施加击退和禁锢1.5秒，每8秒最多触发1次。</li>
      <li>余震 - 秘法师 - 核心刻印效果触发时，击飞附近的敌人，同时造成100%攻击力的物理伤害。</li>
      <li>巨神兵 - 通用 - 使自身体型增大15%、最大生命值提升15%、护盾效果提升15%。</li>
      <li>狂热 - 通用 - 在战斗中每隔8秒，消耗5%当前生命值，解除自身受到的控制效果并获得狂热。</li>
      <li>力量祝福 - 通用 - 核心刻印效果触发时，伤害强化提升60%，持续2秒。</li>
      <li>灵巧 - 通用 - 核心刻印效果触发时，使闪避提升25%，持续2.5秒。</li>
      <li>领袖 - 通用 - 你的所有友军(不包括自己)伤害强化提升15%、急速提升15%。</li>
      <li>全能 - 通用 - 生命值高于80%时，使自身伤害强化提升20%、伤害减免提升15%。</li>
      <li>疯刃专家 - 通用 - [野蛮人限定]疯刃击中时根据疯刃增益效果层数附加每层额外20%攻击力的物理伤害。</li>
      <li>破伤专家 - 通用 - [野蛮人限定]装备破伤技能时，施放核心技能有40%概率触发额外施法，施放所装备的破伤。</li>
      <li>重砍专家 - 通用 - [野蛮人限定]重砍触发跳劈时使目标急速和闪避降低20%，持续2秒;重砍触发护盾时使自身招架提升30%，持续2秒。</li>
      <li>无情收割专家 - 通用 - [野蛮人限定]无情收割施加踉跄状态。</li>
      <li>旋风斩专家 - 通用 - [野蛮人限定]施放旋风斩时会快速朝前方发射5道剑气，造成共计750%攻击力的物理伤害，每5秒最多触发1次。</li>
      <li>原力锤专家 - 通用 - [野蛮人限定]原力锤有3%概率造成1.5秒眩晕和2.5秒弱化。</li>
      <li>寒冰弹专家 - 通用 - [秘法师限定]敌人累计被寒冰弹命中20次会产生1秒冻结。</li>
      <li>火焰波专家 - 通用 - [秘法师限定]火焰波到达终点时有25%概率返回，对沿途的敌人造成伤害。</li>
      <li>闪电鞭专家 - 通用 - [秘法师限定]闪电鞭有10%概率产生闪电链，对5个敌人造成100%攻击力的电元素伤害并施加震颤，持续2.5秒。</li>
      <li>火球术专家 - 通用 - [秘法师限定]火球术击中敌人时产生一次额外的元素爆炸，造成150%攻击的元素伤害并施加燃烧、冰焰燃烧、电各1层。每2秒最多触发1次。</li>
      <li>闪电拳专家 - 通用 - [秘法师限定]每第五次施放闪电拳必定暴击，且每1%暴击率额外提升2%闪电拳增伤。</li>
      <li>寒冰光束专家 - 通用 - [秘法师限定]施放寒冰光束时，在接下来的3秒内持续恢复总计18点能量每6秒最多触发1次。</li>
      <li>奋勇冲击专家 - 通用 - [野蛮人限定]奋勇冲击的伤害倍率提升到3次总计500%，并且奋勇冲击具有额外20%暴击率和80%暴击伤害。</li>
      <li>坚不可摧专家 - 通用 - [野蛮人限定]坚不可摧护盾存在期间，最终暴击伤害抗性提升40%。</li>
      <li>聚气咆哮专家 - 通用 - [野蛮人限定]聚气咆哮期间施放核心技能延长聚气咆哮效果0.5秒持续时间，每次施放聚气咆哮最多延长4秒。</li>
      <li>决战咆哮专家 - 通用 - [野蛮人限定]决战咆哮期间每累计消耗20点怒气，使终极技能冷却时间减少1秒。</li>
      <li>踏平专家 - 通用 - [野蛮人限定]踏平击中首领或其他玩家时，冷却时间减少2秒。</li>
      <li>跃空击专家 - 通用 - [野蛮人限定]跃空击落地时将中等范围内的敌人拉到自己身边。</li>
      <li>冰霜盾专家 - 通用 - [秘法师限定]每次受到攻击时有30%概率使冰霜盾当前冷却减少1秒。</li>
      <li>引力场专家 - 通用 - [秘法师限定]累计在引力场内超过3秒的敌人会被眩晕1秒。</li>
      <li>魔焰花专家 - 通用 - [秘法师限定]魔焰花造成伤害时为你回复1点能量。</li>
      <li>闪电球专家 - 通用 - [秘法师限定]闪电球对敌人施加元素易伤，持续3秒。</li>
      <li>闪现专家 - 通用 - [秘法师限定]闪现后使自身闪避提升15%，持续3秒。</li>
      <li>震荡专家 - 通用 - [秘法师限定]震荡击中敌人时施加缓慢，持续5秒</li>
    </ul>
  </div>
</noscript>

<!-- ===== 技能Tab ===== -->
<div class="tab-panel" id="panel-skill">
  <div class="catalog-toolbar">
    <div class="catalog-search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="skillSearch" placeholder="搜索技能名称/效果..." class="catalog-search-input">

// ===== 公共工具：HTML转义（防XSS） =====
function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

// ===== 统一图鉴详情弹窗（所有Tab共用） =====
function showCatalogModal(item, typeName, prefix) {
  const modal = document.getElementById('catalogModal');
  const body = document.getElementById('catalogModalBody');
  
  // 侍从特殊处理：基本信息用键值对列表
  let basicInfoHtml = '';
  if (prefix === 'pet') {
    const kvItems = [];
    if (item.quality) kvItems.push(['品质', item.quality]);
    if (item.bonds) kvItems.push(['羁绊', item.bonds]);
    if (kvItems.length > 0) {
      basicInfoHtml = `<div class="modal-section">
        <div class="modal-section-title">基本信息</div>
        <div class="modal-kv-list">
          ${kvItems.map(([k,v]) => `<div class="modal-kv"><span class="modal-kv-label">${k}</span><span class="modal-kv-value">${escapeHtml(v)}</span></div>`).join('')}
        </div>
      </div>`;
    }
  }
  
  const extraFields = [];
  if (prefix !== 'pet') {
    if (item.cooldown) extraFields.push(['冷却时间', item.cooldown]);
    if (item.energy) extraFields.push(['能量消耗', item.energy]);
    if (item.category) extraFields.push(['分类', item.category]);
    if (item.part) extraFields.push(['部位', item.part]);
    if (item.quality) extraFields.push(['品质', item.quality]);
    if (item.set) extraFields.push(['套装', item.set]);
    if (item.season) extraFields.push(['赛季', item.season]);
    if (item.bonds) extraFields.push(['羁绊', item.bonds]);
  }
  
  let extraHtml = '';
  for (const [label, value] of extraFields) {
    extraHtml += `
      <div class="modal-section">
        <div class="modal-section-title">${label}</div>
        <div class="modal-section-content">${escapeHtml(value)}</div>
      </div>`;
  }
  
  // 描述：侍从desc为空时显示"详细描述待补充"
  const descText = item.desc ? escapeHtml(item.desc).replace(/\n/g,'<br>') : (prefix === 'pet' ? '<span style="color:var(--text-dim);font-style:italic;">详细描述待补充</span>' : '暂无描述');
  
  body.innerHTML = `
    <div class="modal-header">
      <div class="modal-icon">
        <img src="${item.icon}" alt="${escapeHtml(item.name)}" 
             onerror="this.style.display='none';this.parentElement.innerHTML='🔮'">
      </div>
      <div>
        <div class="modal-title">${escapeHtml(item.name)}</div>
        <div class="modal-meta">
          <span class="engraving-class cls-${item.class}">${item.class}</span>
          ${item.category ? `<span class="engraving-class cls-通用">${item.category}</span>` : ''}
          ${item.part ? `<span class="engraving-class cls-通用">${item.part}</span>` : ''}
        </div>
      </div>
    </div>
    ${basicInfoHtml}
    <div class="modal-section">
      <div class="modal-section-title">${prefix === 'pet' ? '详细描述' : typeName + '效果'}</div>
      <div class="modal-section-content">${descText}</div>
    </div>
    ${extraHtml}
    <div class="modal-section">
      <div class="modal-section-title">获取方式</div>
      <div class="modal-section-content">${escapeHtml(item.source || '官方图鉴')}</div>
    </div>
    ${item.detail_img ? `
    <div class="modal-section">
      <div class="modal-section-title">详情图</div>
      <img src="${item.detail_img}" alt="${escapeHtml(item.name)}详情" class="modal-detail-img" loading="lazy" referrerpolicy="no-referrer">
    </div>` : ''}
  `;
  
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeCatalogModal(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('catalogModal').classList.remove('show');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCatalogModal();
});

    skill: {search:'skillSearch', fn:'filterSkill'},
    rune: {search:'runeSearch', fn:'filterRune'},
    armor: {search:'armorSearch', fn:'filterArmor'},
    pet: {search:'petSearch', fn:'filterPet'}
  };
  const c = config[tab];
  if(!c) return;
  const s = document.getElementById(c.search);
  if(s) s.value = '';
  // 直接调用各Tab的filter函数重置状态（let声明的变量不挂window，必须用函数）
  if(c.fn && typeof window[c.fn] === 'function') window[c.fn]('all');
}
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  resetTabState(tab);
  if (tab === 'build') initBuildTab();
  if (tab === 'engraving') initEngravingsTab();
  if (tab === 'skill') initSkillTab();
  if (tab === 'rune') initRuneTab();
  if (tab === 'armor') initArmorTab();
  if (tab === 'pet') initPetTab();
}
// 默认显示配装Tab
document.addEventListener('DOMContentLoaded', function() {
  switchTab('build');
});

</script>

</body>
</html>
