.slot-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; justify-content: center; }
.slot-btn { padding: 6px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 13px; cursor: pointer; transition: all 0.2s; }

/* 分类标签 */
.category-tabs { display: flex; gap: 8px; margin-bottom: 16px; justify-content: center; }

.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; transition: all 0.2s; }
.stat-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.stat-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.stat-name.special { color: var(--orange); }
.stat-name.normal { color: var(--text-bright); }
.stat-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }

const SLOT_ORDER = ['武器','头盔','护肩','胸甲','护手','护腿','靴子','护腕','腰带','项链','护符','戒指'];
const ATTACK_SLOTS = ['武器','头盔','护肩'];
const DEFENSE_SLOTS = ['胸甲','护手','护腿','靴子','护腕','腰带'];
const ACCESSORY_SLOTS = ['项链','护符','戒指'];

let currentSlot = '武器';
let currentCategory = 'all';
let searchKeyword = '';

function renderSlotFilters() {
  const container = document.getElementById('slotFilters');
  let slots = SLOT_ORDER;
  if (currentCategory === 'attack') slots = ATTACK_SLOTS;
  else if (currentCategory === 'defense') slots = DEFENSE_SLOTS;
  else if (currentCategory === 'accessory') slots = ACCESSORY_SLOTS;
  
  container.innerHTML = slots.map(slot => {
    const count = WASH_DATA[slot] ? WASH_DATA[slot].length : 0;
    const active = slot === currentSlot ? 'active' : '';
    return `<button class="slot-btn ${active}" onclick="selectSlot('${slot}')">${slot}<span class="count">${count}</span></button>`;
  }).join('');
}

function selectSlot(slot) {
  currentSlot = slot;
  renderSlotFilters();
  renderStats();
}

function setCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  // 如果当前选中的部位不在这个分类里，自动选第一个
  let slots = SLOT_ORDER;
  if (cat === 'attack') slots = ATTACK_SLOTS;
  else if (cat === 'defense') slots = DEFENSE_SLOTS;
  else if (cat === 'accessory') slots = ACCESSORY_SLOTS;
  if (!slots.includes(currentSlot)) currentSlot = slots[0];
  renderSlotFilters();
  renderStats();
}

function renderStats() {
  const stats = WASH_DATA[currentSlot] || [];
  const maxCount = Math.max(...stats.map(s => s.count), 1);
  
  // 部位信息
  const specialCount = stats.filter(s => s.special).length;
  const normalCount = stats.filter(s => !s.special).length;
  document.getElementById('slotInfo').innerHTML = `
    <div class="slot-info-title">${currentSlot} · 洗炼词条</div>
    <div class="slot-info-stats">
      <span>共 <strong>${stats.length}</strong> 条</span>
      <span>铸造强化 <strong style="color:var(--orange)">${specialCount}</strong> 条</span>
      <span>普通词条 <strong>${normalCount}</strong> 条</span>
    </div>
  `;
  
  // 筛选
  let filtered = stats;
  if (searchKeyword) {
    filtered = stats.filter(s => s.name.toLowerCase().includes(searchKeyword.toLowerCase()));
  }
  
  // 按铸造强化优先，再按频率排序
  filtered.sort((a, b) => {
    if (a.special !== b.special) return a.special ? -1 : 1;
    return b.count - a.count;
  });
  
  const grid = document.getElementById('statsGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">没有找到匹配的词条</div>';
    return;
  }
  
  grid.innerHTML = filtered.map(s => {
    const freqPercent = (s.count / maxCount * 100).toFixed(0);
    return `
      <div class="stat-card">
        <div class="stat-name ${s.special ? 'special' : 'normal'}">
          ${s.name}
          <span class="stat-tag ${s.special ? 'special' : 'normal'}">${s.special ? '铸造强化' : '普通'}</span>
        </div>
        <div class="stat-meta">
          <span>出现于 ${s.count} 套配装</span>
          <div class="stat-frequency">
            <div class="frequency-bar"><div class="frequency-fill" style="width:${freqPercent}%"></div></div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function filterStats() {
  searchKeyword = document.querySelector('.search-input').value;
  renderStats();
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.querySelector('.nav-icon-btn').textContent = next === 'dark' ? '🌙' : '☀️';
}

const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.addEventListener('DOMContentLoaded', function() {
  document.querySelector('.nav-icon-btn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
  renderSlotFilters();
  renderStats();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
