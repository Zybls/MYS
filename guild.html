<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公会中心 · 天涯若比邻 | 英雄没有闪</title>
<meta name="description" content="天涯若比邻公会中心，活动报名、留言板、成员榜、历史战报、考勤统计。">
<link rel="canonical" href="https://ykmys.com/guild.html">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#e4e4e7;min-height:100vh;padding-bottom:80px}
:root{--bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;--border:rgba(255,255,255,0.08);--text:#e4e4e7;--text-dim:#a1a1aa;--accent:#60a5fa;--accent2:#fbbf24;--success:#34d399;--danger:#f87171}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:20px;text-align:center;border-bottom:1px solid var(--border)}
.header h1{font-size:22px;color:#fff;margin-bottom:4px}
.header p{font-size:13px;color:var(--text-dim)}
.guild-info{display:flex;justify-content:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.guild-info span{font-size:12px;color:var(--text-dim);background:rgba(255,255,255,0.05);padding:4px 12px;border-radius:12px}
.tabs{display:flex;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:14px 16px;font-size:14px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.panel{display:none;padding:20px;max-width:800px;margin:0 auto}
.panel.active{display:block}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:0.5}
.empty-state h3{font-size:16px;margin-bottom:8px;color:var(--text)}
.empty-state p{font-size:13px}
.activity-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.activity-card .act-title{font-size:16px;font-weight:600;color:#fff;margin-bottom:6px}
.activity-card .act-meta{display:flex;gap:12px;font-size:12px;color:var(--text-dim);margin-bottom:10px;flex-wrap:wrap}
.activity-card .act-meta span{background:rgba(255,255,255,0.05);padding:2px 8px;border-radius:4px}
.activity-card .act-desc{font-size:13px;color:var(--text-dim);margin-bottom:12px;line-height:1.6}
.activity-card .act-status{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;margin-bottom:10px}
.status-ended{background:rgba(52,211,153,0.15);color:var(--success)}
.status-upcoming{background:rgba(96,165,250,0.15);color:var(--accent)}
.signup-form{background:var(--bg3);border-radius:8px;padding:14px;margin-top:12px}
.signup-form h4{font-size:13px;margin-bottom:10px;color:var(--accent)}
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row input{flex:1;min-width:120px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px}
.form-row input:focus{outline:none;border-color:var(--accent)}
.btn{padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s}
.btn:hover{background:#3b82f6}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.signup-list{margin-top:14px}
.signup-list h4{font-size:13px;margin-bottom:8px;color:var(--text-dim)}
.signup-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.signup-item .name{color:var(--text)}
.signup-item .prof{color:var(--text-dim);font-size:12px}
.comment-section{margin-bottom:20px}
.comment-form{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px}
.comment-form h4{font-size:14px;margin-bottom:12px;color:var(--accent)}
.comment-form input,.comment-form textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;margin-bottom:10px;font-family:inherit}
.comment-form textarea{min-height:80px;resize:vertical}
.comment-form input:focus,.comment-form textarea:focus{outline:none;border-color:var(--accent)}
.comment-list .comment-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.comment-item .c-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.comment-item .c-name{font-size:14px;font-weight:600;color:var(--accent)}
.comment-item .c-time{font-size:11px;color:var(--text-dim)}
.comment-item .c-content{font-size:13px;line-height:1.7;color:var(--text)}
.message-form{background:var(--bg3);border-radius:10px;padding:16px;margin-top:20px;border:1px dashed var(--border)}
.message-form h4{font-size:14px;margin-bottom:10px;color:var(--accent2)}
.message-form p{font-size:12px;color:var(--text-dim);margin-bottom:10px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--text-dim);font-size:11px;gap:2px;flex:1}
.nav-item.active{color:var(--accent)}
.nav-item .nav-icon{font-size:20px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;display:none}
.toast.show{display:block}
@media(max-width:768px){
  .header h1{font-size:18px}
  .guild-info span{font-size:11px;padding:3px 8px}
  .panel{padding:14px}
  .form-row{flex-direction:column}
  .form-row input{min-width:auto}
}
</style>
</head>
<body>
<div class="header">
  <h1>公会中心</h1>
  <p>天涯若比邻 · 灾厄枷锁18服</p>
  <div class="guild-info">
    <span>成员 40/40</span>
    <span>公会等级 22</span>
    <span>总战力 2266万兆</span>
    <span>神殿联赛 6届</span>
  </div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="signup" onclick="switchTab('signup')">活动报名</div>
  <div class="tab" data-tab="attendance" onclick="switchTab('attendance')">考勤统计</div>
  <div class="tab" data-tab="members" onclick="switchTab('members')">成员名录</div>
  <div class="tab" data-tab="battles" onclick="switchTab('battles')">历史战报</div>
  <div class="tab" data-tab="news" onclick="switchTab('news')">公会动态</div>
  <div class="tab" data-tab="comments" onclick="switchTab('comments')">留言板</div>
</div>

<!-- 活动报名 -->
<div class="panel active" id="panel-signup">
  <div id="activity-list"><p style="text-align:center;color:var(--text-dim);padding:40px">加载中...</p></div>
</div>

<!-- 考勤统计（空状态） -->
<div class="panel" id="panel-attendance">
  <div class="empty-state">
    <div class="icon">📊</div>
    <h3>考勤统计</h3>
    <p>数据补充中，敬请期待</p>
  </div>
</div>

<!-- 成员名录（空状态） -->
<div class="panel" id="panel-members">
  <div class="empty-state">
    <div class="icon">👥</div>
    <h3>成员名录</h3>
    <p>数据补充中，敬请期待</p>
  </div>
</div>

<!-- 历史战报（空状态） -->
<div class="panel" id="panel-battles">
  <div class="empty-state">
    <div class="icon">⚔️</div>
    <h3>历史战报</h3>
    <p>数据补充中，敬请期待</p>
  </div>
</div>

<!-- 公会动态（空状态） -->
<div class="panel" id="panel-news">
  <div class="empty-state">
    <div class="icon">📢</div>
    <h3>公会动态</h3>
    <p>数据补充中，敬请期待</p>
  </div>
</div>

<!-- 留言板 -->
<div class="panel" id="panel-comments">
  <div class="comment-section">
    <div class="comment-form">
      <h4>发表评论</h4>
      <input type="text" id="c-nickname" placeholder="你的昵称（选填）" maxlength="20">
      <textarea id="c-content" placeholder="说点什么..." maxlength="500"></textarea>
      <button class="btn" onclick="submitComment()">发表评论</button>
    </div>
    <div class="comment-list" id="comment-list"><p style="text-align:center;color:var(--text-dim);padding:20px">加载中...</p></div>
  </div>
  <div class="message-form">
    <h4>私信会长</h4>
    <p>有问题想单独跟会长说？在这里留言，只有会长能看到。</p>
    <input type="text" id="m-name" placeholder="你的游戏ID" maxlength="20" style="width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;margin-bottom:10px">
    <input type="text" id="m-contact" placeholder="联系方式（QQ/微信，选填）" maxlength="50" style="width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;margin-bottom:10px">
    <textarea id="m-content" placeholder="留言内容..." maxlength="500" style="width:100%;min-height:80px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;margin-bottom:10px;font-family:inherit;resize:vertical"></textarea>
    <button class="btn" onclick="submitMessage()" style="background:var(--accent2)">发送私信</button>
  </div>
</div>

<div class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>首页</a>
  <a href="library.html" class="nav-item"><span class="nav-icon">📚</span>资料库</a>
  <a href="guild.html" class="nav-item active"><span class="nav-icon">⚔️</span>公会</a>
  <a href="tools.html" class="nav-item"><span class="nav-icon">🔧</span>工具</a>
</div>

<div class="toast" id="toast"></div>

<noscript>
<div style="padding:20px;">
<h2>公会中心</h2>
<p>天涯若比邻公会，灾厄枷锁18服，40/40满编，总战力2266万兆。</p>
<ul>
<li>活动报名：神殿纷争每周六，报名请使用浏览器开启JavaScript</li>
<li>留言板：公会成员交流区</li>
<li>成员名录：40位成员战力排行</li>
<li>历史战报：第六届联赛半决赛止步</li>
</ul>
</div>
</noscript>

<script>
const API_BASE = 'https://api.ykmys.com';

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));
  if(tab==='signup') loadActivities();
  if(tab==='comments') loadComments();
}

// 活动报名
async function loadActivities(){
  const list=document.getElementById('activity-list');
  try{
    const res=await fetch(API_BASE+'/api/activities');
    const data=await res.json();
    const acts=Array.isArray(data)?data:(data.data||[]);
    if(acts.length===0){
      list.innerHTML='<div class="empty-state"><div class="icon">📋</div><h3>暂无活动</h3><p>管理员正在创建活动，请稍后再来</p></div>';
      return;
    }
    list.innerHTML=acts.map(a=>{
      const statusClass=a.status==='已结束'?'status-ended':'status-upcoming';
      const canSignup=a.status!=='已结束';
      return `<div class="activity-card">
        <div class="act-title">${escapeHtml(a.title)}</div>
        <span class="act-status ${statusClass}">${escapeHtml(a.status)}</span>
        <div class="act-meta">
          <span>🗓️ ${escapeHtml(a.date||'日期待定')}</span>
          <span>⏰ ${escapeHtml(a.time||'20:00')}</span>
          <span>👥 ${a.max_participants||40}人</span>
        </div>
        <div class="act-desc">${escapeHtml(a.description||'')}</div>
        ${canSignup?`
        <div class="signup-form">
          <h4>快速报名</h4>
          <div class="form-row">
            <input type="text" id="sg-name-${a.id}" placeholder="游戏ID" maxlength="20">
            <input type="text" id="sg-prof-${a.id}" placeholder="职业" maxlength="10">
          </div>
          <input type="text" id="sg-remark-${a.id}" placeholder="备注（选填）" maxlength="50" style="width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;margin-bottom:10px">
          <button class="btn" onclick="submitSignup('${a.id}','${escapeHtml(a.title)}')">确认报名</button>
        </div>
        <div class="signup-list" id="sg-list-${a.id}"></div>`:'<p style="font-size:12px;color:var(--text-dim)">活动已结束</p>'}
      </div>`;
    }).join('');
    // 加载已报名列表
    acts.forEach(a=>{if(a.status!=='已结束') loadSignups(a.id);});
  }catch(e){
    list.innerHTML='<div class="empty-state"><div class="icon">❌</div><h3>加载失败</h3><p>'+escapeHtml(e.message)+'</p></div>';
  }
}

async function submitSignup(actId, actTitle){
  const name=document.getElementById('sg-name-'+actId).value.trim();
  const prof=document.getElementById('sg-prof-'+actId).value.trim();
  const remark=document.getElementById('sg-remark-'+actId).value.trim();
  if(!name){showToast('请填写游戏ID');return;}
  try{
    const res=await fetch(API_BASE+'/api/signups',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({game_id:name,activity:actTitle,profession:prof,remark:remark})
    });
    if(res.ok){
      showToast('报名成功！');
      document.getElementById('sg-name-'+actId).value='';
      document.getElementById('sg-prof-'+actId).value='';
      document.getElementById('sg-remark-'+actId).value='';
      loadSignups(actId);
    }else{
      const err=await res.json();
      showToast(err.error||'报名失败');
    }
  }catch(e){showToast('网络错误：'+e.message);}
}

async function loadSignups(actId){
  const list=document.getElementById('sg-list-'+actId);
  if(!list)return;
  try{
    const res=await fetch(API_BASE+'/api/signups');
    const data=await res.json();
    const all=Array.isArray(data)?data:(data.data||[]);
    const signups=all.filter(s=>s.activity===actId||s.activity_id===actId);
    if(signups.length>0){
      list.innerHTML='<h4>已报名 ('+signups.length+')</h4>'+signups.map(s=>
        `<div class="signup-item"><span class="name">${escapeHtml(s.game_id)}</span><span class="prof">${escapeHtml(s.profession||'')}</span></div>`
      ).join('');
    }
  }catch(e){}
}

// 留言板
async function loadComments(){
  const list=document.getElementById('comment-list');
  try{
    const res=await fetch(API_BASE+'/api/comments?page=guild');
    const data=await res.json();
    const comments=Array.isArray(data)?data:(data.data||[]);
    if(comments.length===0){
      list.innerHTML='<p style="text-align:center;color:var(--text-dim);padding:20px">还没有评论，来抢沙发吧</p>';
      return;
    }
    list.innerHTML=comments.map(c=>`<div class="comment-item">
      <div class="c-header"><span class="c-name">${escapeHtml(c.nickname||'匿名')}</span><span class="c-time">${escapeHtml(c.created_at||'')}</span></div>
      <div class="c-content">${escapeHtml(c.content)}</div>
    </div>`).join('');
  }catch(e){
    list.innerHTML='<p style="text-align:center;color:var(--text-dim);padding:20px">加载失败</p>';
  }
}

async function submitComment(){
  const nickname=document.getElementById('c-nickname').value.trim()||'匿名玩家';
  const content=document.getElementById('c-content').value.trim();
  if(!content){showToast('请输入评论内容');return;}
  try{
    const res=await fetch(API_BASE+'/api/comments',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({page:'guild',nickname,content})
    });
    if(res.ok){
      showToast('评论发表成功！');
      document.getElementById('c-nickname').value='';
      document.getElementById('c-content').value='';
      loadComments();
    }else{
      const err=await res.json();
      showToast(err.error||'发表失败');
    }
  }catch(e){showToast('网络错误：'+e.message);}
}

async function submitMessage(){
  const name=document.getElementById('m-name').value.trim();
  const contact=document.getElementById('m-contact').value.trim();
  const content=document.getElementById('m-content').value.trim();
  if(!name||!content){showToast('请填写游戏ID和留言内容');return;}
  try{
    const res=await fetch(API_BASE+'/api/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,contact,content})
    });
    if(res.ok){
      showToast('私信已发送给会长！');
      document.getElementById('m-name').value='';
      document.getElementById('m-contact').value='';
      document.getElementById('m-content').value='';
    }else{
      const err=await res.json();
      showToast(err.error||'发送失败');
    }
  }catch(e){showToast('网络错误：'+e.message);}
}

// 初始化
loadActivities();
</script>
</body>
</html>
