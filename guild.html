.guild-modal-overlay.show{display:flex}

.guild-modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-dim);font-size:24px;cursor:pointer;line-height:1}

.guild-modal h3{font-size:18px;color:#fff;margin-bottom:16px;padding-right:30px}

.guild-modal-kv:last-child{border-bottom:none}
.guild-modal-kv-label{color:var(--text-dim)}
.guild-modal-kv-value{color:var(--text);font-weight:600;text-align:right;max-width:60%}
/* 时间线 */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:16px}
.timeline-item::before{content:'';position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg2)}
.timeline-date{font-size:11px;color:var(--text-dim);margin-bottom:4px}
.timeline-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(96,165,250,0.15);color:var(--accent);margin-bottom:4px}

<h3>公会动态（8条）</h3>
<ul><li>赛事预告：第六届季军赛天涯+神话 vs 意气阁丶剑歌+无畏神殿</li><li>人员调整：6进6出，新加入喜子、远方、老王等</li><li>战报：第六届半决赛2385:15000负于奶牛俱乐部</li><li>战报：第六届第1周15000:13020胜刀剑神域</li><li>周报：总战力1838.94万兆、40/40满编</li><li>战报：第五届vs巅峰5195:15000负于巅峰</li><li>战报：第五届季军赛15000:9290胜天外天</li><li>战报：第五届4强赛4415:15000负于意气阁丶剑歌</li></ul>
</div></noscript>
<script>
const API_BASE='https://api.ykmys.com';
var membersData=[],battlesData=[],newsData=[],tabState={memberFilter:'all',newsFilter:'all'};
function escapeHtml(str){return (str||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function switchTab(tab){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));
if(tab==='members'){tabState.memberFilter='all';document.querySelectorAll('#member-filters .filter-btn').forEach((b,i)=>b.classList.toggle('active',i===0));loadMembers();}
if(tab==='news'){tabState.newsFilter='all';document.querySelectorAll('#news-filters .filter-btn').forEach((b,i)=>b.classList.toggle('active',i===0));loadNews();}
if(tab==='signup')loadActivities();
if(tab==='battles')loadBattles();
if(tab==='comments')loadComments();}
function getMemberRole(status){if(!status)return 'normal';const s=String(status);if(s==='会长')return 'chief';if(s==='战神')return 'warrior';if(s==='副会'||s==='副会长')return 'vice';if(s==='先锋')return 'pioneer';return 'normal';}
const ROLE_ORDER={chief:1,warrior:2,vice:3,pioneer:4,normal:5};
function parsePower(power){if(!power)return 0;const m=String(power).match(/([\d.]+)/);return m?parseFloat(m[1]):0;}
function getRoleTag(status){const role=getMemberRole(status);const labels={chief:'会长',warrior:'战神',vice:'副会',pioneer:'先锋',normal:'成员'};return '<span class="m-tag m-tag-'+role+'">'+(labels[role]||'成员')+'</span>';}
async function loadActivities(){const list=document.getElementById('activity-list');try{const res=await fetch(API_BASE+'/api/activities');const data=await res.json();const acts=Array.isArray(data)?data:(data.data||[]);if(acts.length===0){list.innerHTML='<div class="empty-state"><div class="icon">📋</div><h3>暂无活动</h3><p>管理员正在创建活动，请稍后再来</p></div>';return;}list.innerHTML=acts.map(a=>{const statusClass=a.status==='已结束'?'status-ended':'status-upcoming';const canSignup=a.status!=='已结束';return `<div class="activity-card"><div class="act-title">${escapeHtml(a.title)}</div><span class="act-status ${statusClass}">${escapeHtml(a.status)}</span><div class="act-meta"><span>🗓️ ${escapeHtml(a.date||'日期待定')}</span><span>⏰ ${escapeHtml(a.time||'20:00')}</span><span>👥 ${a.max_participants||40}人</span></div><div class="act-desc">${escapeHtml(a.description||'')}</div>${canSignup?`<div class="signup-form"><h4>快速报名</h4><input type="text" id="sg-name-${a.id}" placeholder="游戏ID" maxlength="20"><input type="text" id="sg-remark-${a.id}" placeholder="备注（选填）" maxlength="50"><button class="btn" onclick="submitSignup('${a.id}','${escapeHtml(a.title)}')">确认报名</button></div><div class="signup-list" id="sg-list-${a.id}"></div>`:'<p style="font-size:12px;color:var(--text-dim)">活动已结束</p>'}</div>`;}).join('');acts.forEach(a=>{if(a.status!=='已结束')loadSignups(a.id);});}catch(e){list.innerHTML='<div class="empty-state"><div class="icon">❌</div><h3>加载失败</h3><p>'+escapeHtml(e.message)+'</p></div>';}}
async function submitSignup(actId,actTitle){const name=document.getElementById('sg-name-'+actId).value.trim();const remark=document.getElementById('sg-remark-'+actId).value.trim();if(!name){showToast('请填写游戏ID');return;}try{const res=await fetch(API_BASE+'/api/signups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game_id:name,activity:actTitle,remark:remark})});if(res.ok){showToast('报名成功！');document.getElementById('sg-name-'+actId).value='';document.getElementById('sg-remark-'+actId).value='';loadSignups(actId);}else{const err=await res.json();showToast(err.error||'报名失败');}}catch(e){showToast('网络错误：'+e.message);}}
async function loadSignups(actId){const list=document.getElementById('sg-list-'+actId);if(!list)return;try{const res=await fetch(API_BASE+'/api/signups');const data=await res.json();const all=Array.isArray(data)?data:(data.data||[]);const signups=all.filter(s=>s.activity===actId||s.activity_id===actId);if(signups.length>0){list.innerHTML='<h4>已报名 ('+signups.length+')</h4>'+signups.map(s=>`<div class="signup-item"><span class="name">${escapeHtml(s.game_id)}</span><span class="prof">${escapeHtml(s.remark||'')}</span></div>`).join('');}}catch(e){}}
async function loadMembers(){const grid=document.getElementById('member-grid');if(membersData.length>0){renderMembers();return;}try{const res=await fetch(API_BASE+'/api/members');const data=await res.json();membersData=Array.isArray(data)?data:(data.data||[]);renderMembers();}catch(e){grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:40px">加载失败</p>';}}
function renderMembers(){const grid=document.getElementById('member-grid');let list=membersData.slice();
if(tabState.memberFilter!=='all'){
  if(tabState.memberFilter==='management'){list=list.filter(m=>['chief','warrior','vice'].includes(getMemberRole(m.status)));}
  else if(tabState.memberFilter==='member'){list=list.filter(m=>getMemberRole(m.status)==='normal');}
  else{list=list.filter(m=>getMemberRole(m.status)===tabState.memberFilter);}
}
list.sort((a,b)=>{const ra=ROLE_ORDER[getMemberRole(a.status)]||9,rb=ROLE_ORDER[getMemberRole(b.status)]||9;if(ra!==rb)return ra-rb;return parsePower(b.power)-parsePower(a.power);});
if(list.length===0){grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:40px">暂无成员数据</p>';return;}
grid.innerHTML=list.map((m,i)=>'<div class="member-card" data-id="'+escapeHtml(m.id)+'" onclick="showMemberDetail(\''+escapeHtml(m.id)+'\')"><div class="m-rank">#'+(i+1)+'</div><div class="m-name">'+escapeHtml(m.game_id)+'</div><div class="m-power">'+escapeHtml(m.power||'未知')+'</div><div class="m-tags">'+getRoleTag(m.status)+'</div></div>').join('');}
function filterMembers(filter){tabState.memberFilter=filter;document.querySelectorAll('#member-filters .filter-btn').forEach((b,i)=>{b.classList.toggle('active',(filter==='all'&&i===0)||(filter==='management'&&i===1)||(filter==='pioneer'&&i===2)||(filter==='member'&&i===3));});renderMembers();}
async function loadBattles(){const list=document.getElementById('battle-list');try{const res=await fetch(API_BASE+'/api/battles');const data=await res.json();battlesData=Array.isArray(data)?data:(data.data||[]);
if(battlesData.length===0){list.innerHTML='<div class="empty-state"><div class="icon">⚔️</div><h3>暂无战报</h3><p>数据补充中</p></div>';return;}
battlesData.sort((a,b)=>(b.battle_date||'').localeCompare(a.battle_date||''));
list.innerHTML=battlesData.map(b=>{const isWin=b.our_score>=b.enemy_score;return '<div class="battle-card" data-id="'+escapeHtml(b.id)+'" onclick="showBattleDetail(\''+escapeHtml(b.id)+'\')"><div class="b-title">'+escapeHtml(b.activity_id||b.title||'神殿纷争')+'</div><div class="b-score"><span class="b-our">'+b.our_score+'</span><span class="b-vs">VS</span><span class="b-enemy">'+b.enemy_score+'</span><span class="b-result '+(isWin?'b-result-win':'b-result-lose')+'">'+(isWin?'胜':'负')+'</span></div><div class="b-meta"><span>对手：'+escapeHtml(b.opponent||'未知')+'</span>'+(b.mvp?'<span>MVP：'+escapeHtml(b.mvp)+'</span>':'')+(b.battle_date?'<span>'+escapeHtml(b.battle_date)+'</span>':'')+'</div></div>';}).join('');
}catch(e){list.innerHTML='<div class="empty-state"><div class="icon">❌</div><h3>加载失败</h3><p>'+escapeHtml(e.message)+'</p></div>';}}
async function loadNews(){const list=document.getElementById('news-list');try{const res=await fetch(API_BASE+'/api/changelog');const data=await res.json();newsData=Array.isArray(data)?data:(data.data||[]);
renderNews();
}catch(e){list.innerHTML='<div class="empty-state"><div class="icon">❌</div><h3>加载失败</h3><p>'+escapeHtml(e.message)+'</p></div>';}}
function renderNews(){const list=document.getElementById('news-list');let logs=newsData.slice();
if(tabState.newsFilter!=='all'){logs=logs.filter(l=>(l.tag||'').includes(tabState.newsFilter));}
if(logs.length===0){list.innerHTML='<p style="text-align:center;color:var(--text-dim);padding:40px">暂无该分类动态</p>';return;}
logs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
list.innerHTML='<div class="timeline">'+logs.map(l=>'<div class="timeline-item"><div class="timeline-date">'+escapeHtml(l.date||'')+'</div><span class="timeline-tag">'+escapeHtml(l.tag||'动态')+'</span><div class="timeline-content">'+escapeHtml(l.content||'').replace(/\n/g,'<br>')+'</div></div>').join('')+'</div>';}
function filterNews(tag){tabState.newsFilter=tag;document.querySelectorAll('#news-filters .filter-btn').forEach((b)=>{b.classList.toggle('active',b.textContent.trim()===tag||(tag==='all'&&b.textContent.trim()==='全部'));});renderNews();}
async function loadComments(){const list=document.getElementById('comment-list');try{const res=await fetch(API_BASE+'/api/comments?page=guild');const data=await res.json();const comments=Array.isArray(data)?data:(data.data||[]);if(comments.length===0){list.innerHTML='<p style="text-align:center;color:var(--text-dim);padding:20px">还没有评论，来抢沙发吧</p>';return;}list.innerHTML=comments.map(c=>`<div class="comment-item"><div class="c-header"><span class="c-name">${escapeHtml(c.nickname||'匿名')}</span><span class="c-time">${escapeHtml(c.created_at||'')}</span></div><div class="c-content">${escapeHtml(c.content)}</div></div>`).join('');}catch(e){list.innerHTML='<p style="text-align:center;color:var(--text-dim);padding:20px">加载失败</p>';}}
async function submitComment(){const nickname=document.getElementById('c-nickname').value.trim()||'匿名玩家';const content=document.getElementById('c-content').value.trim();if(!content){showToast('请输入评论内容');return;}try{const res=await fetch(API_BASE+'/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'guild',nickname,content})});if(res.ok){showToast('评论发表成功！');document.getElementById('c-nickname').value='';document.getElementById('c-content').value='';loadComments();}else{const err=await res.json();showToast(err.error||'发表失败');}}catch(e){showToast('网络错误：'+e.message);}}
async function submitMessage(){const name=document.getElementById('m-name').value.trim();const contact=document.getElementById('m-contact').value.trim();const content=document.getElementById('m-content').value.trim();if(!name||!content){showToast('请填写游戏ID和留言内容');return;}try{const res=await fetch(API_BASE+'/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,contact,content})});if(res.ok){showToast('私信已发送给会长！');document.getElementById('m-name').value='';document.getElementById('m-contact').value='';document.getElementById('m-content').value='';}else{const err=await res.json();showToast(err.error||'发送失败');}}catch(e){showToast('网络错误：'+e.message);}}

// === 统一弹窗组件 ===
function openGuildModal(htmlContent){document.getElementById('guildModalContent').innerHTML=htmlContent;document.getElementById('guildModalOverlay').classList.add('show');document.body.style.overflow='hidden';}
function closeGuildModal(e){if(e&&e.target!==document.getElementById('guildModalOverlay')&&e.type==='click')return;document.getElementById('guildModalOverlay').classList.remove('show');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGuildModal();});
// 成员详情
function showMemberDetail(id){const m=membersData.find(x=>x.id===id);if(!m)return;const role=getMemberRole(m.status);const roleLabels={chief:'会长',warrior:'战神',vice:'副会',pioneer:'先锋',normal:'成员'};
openGuildModal('<h3>'+escapeHtml(m.game_id)+'</h3><div class="guild-modal-section"><div class="guild-modal-section-title">基本信息</div><div class="guild-modal-kv"><span class="guild-modal-kv-label">职位</span><span class="guild-modal-kv-value">'+getRoleTag(m.status)+'</span></div><div class="guild-modal-kv"><span class="guild-modal-kv-label">当前战力</span><span class="guild-modal-kv-value">'+escapeHtml(m.power||'未知')+'</span></div>'+(m.remark?'<div class="guild-modal-kv"><span class="guild-modal-kv-label">备注</span><span class="guild-modal-kv-value">'+escapeHtml(m.remark)+'</span></div>':'')+'</div><div class="guild-modal-section"><div class="guild-modal-section-title">参战数据</div><p style="color:var(--text-dim);font-size:13px;font-style:italic">考勤数据补充中，敬请期待</p></div>');}
// 战报详情
function showBattleDetail(id){const b=battlesData.find(x=>x.id===id);if(!b)return;const isWin=b.our_score>=b.enemy_score;
openGuildModal('<h3>'+escapeHtml(b.activity_id||b.title||'神殿纷争')+' <span style="font-size:14px;color:'+(isWin?'var(--success)':'var(--danger)')+'">'+(isWin?'胜利':'失败')+'</span></h3><div class="guild-modal-section"><div class="guild-modal-section-title">比分</div><div style="text-align:center;font-size:28px;font-weight:700;margin:12px 0"><span style="color:var(--accent)">'+b.our_score+'</span> <span style="color:var(--text-dim);font-size:16px">VS</span> <span style="color:var(--danger)">'+b.enemy_score+'</span></div></div><div class="guild-modal-section"><div class="guild-modal-section-title">详细信息</div>'+(b.opponent?'<div class="guild-modal-kv"><span class="guild-modal-kv-label">对手</span><span class="guild-modal-kv-value">'+escapeHtml(b.opponent)+'</span></div>':'')+(b.battle_date?'<div class="guild-modal-kv"><span class="guild-modal-kv-label">日期</span><span class="guild-modal-kv-value">'+escapeHtml(b.battle_date)+'</span></div>':'')+(b.mvp?'<div class="guild-modal-kv"><span class="guild-modal-kv-label">MVP</span><span class="guild-modal-kv-value">'+escapeHtml(b.mvp)+'</span></div>':'')+(b.mvp_merit?'<div class="guild-modal-kv"><span class="guild-modal-kv-label">MVP功勋</span><span class="guild-modal-kv-value">'+Number(b.mvp_merit).toLocaleString()+'</span></div>':'')+(b.participants?'<div class="guild-modal-kv"><span class="guild-modal-kv-label">参战人数</span><span class="guild-modal-kv-value">'+escapeHtml(String(b.participants))+'人</span></div>':'')+(b.total_merit?'<div class="guild-modal-kv"><span class="guild-modal-kv-label">总功勋</span><span class="guild-modal-kv-value">'+Number(b.total_merit).toLocaleString()+'</span></div>':'')+'</div>'+(b.description?'<div class="guild-modal-section"><div class="guild-modal-section-title">战报描述</div><p style="font-size:13px;line-height:1.7;color:var(--text)">'+escapeHtml(b.description).replace(/\n/g,'<br>')+'</p></div>':'')+'');}

loadActivities();
</script>

<!-- 统一弹窗 -->
<div class="guild-modal-overlay" id="guildModalOverlay" onclick="closeGuildModal(event)">
  <div class="guild-modal" id="guildModal" onclick="event.stopPropagation()">
    <button class="guild-modal-close" onclick="closeGuildModal()">&times;</button>
    <div id="guildModalContent"></div>
  </div>
</div>

</body>
</html>
