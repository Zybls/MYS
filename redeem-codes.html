<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #0b0b12; --bg-card: #15151f; --bg-card2: #1c1c2a;
    --border: #2a2a3e; --gold: #f59e0b; --gold-dim: #b45309;
    --text: #d8d8e8; --text-dim: #8892a8; --text-bright: #f1f5f9;
    --green: #22c55e; --red: #ef4444; --radius: 14px;
}
[data-theme="light"] { --bg:#f5f5f7; --bg-card:#fff; --bg-card2:#f8f8fa; --border:#e0e0e8; --gold:#d97706; --text:#1a1a2e; --text-dim:#5a5a6e; --text-bright:#0a0a15; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; padding-top: 64px; min-height: 100vh; }

/* 导航 */
.guild-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: rgba(11,11,18,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(245,158,11,0.15); }
.guild-nav-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 8px 20px; gap: 12px; }
.guild-nav-left { display: flex; align-items: center; gap: 12px; }
.guild-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(245,158,11,0.4); }
.guild-nav-name { font-size: 15px; font-weight: 800; color: var(--gold); }
.guild-nav-slogan { font-size: 10px; color: var(--text-dim); }
.guild-nav-links { display: flex; gap: 16px; }
.guild-nav-link { color: var(--text); text-decoration: none; font-size: 13px; transition: color 0.2s; }
.guild-nav-link:hover, .guild-nav-link.active { color: var(--gold); }
.nav-icon-btn { background: none; border: none; color: var(--text); font-size: 15px; cursor: pointer; padding: 6px 8px; border-radius: 6px; }
.nav-icon-btn:hover { background: var(--bg-card2); color: var(--gold); }

.container { max-width: 900px; margin: 0 auto; padding: 20px; }

.page-header { text-align: center; margin-bottom: 28px; }
.page-title { font-size: 28px; font-weight: 800; color: var(--gold); margin-bottom: 6px; }
.page-subtitle { font-size: 14px; color: var(--text-dim); }
.update-time { display: inline-block; margin-top: 8px; padding: 4px 12px; background: var(--bg-card2); border-radius: 20px; font-size: 12px; color: var(--text-dim); }

/* 使用说明 */
.guide-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
.guide-title { font-size: 16px; font-weight: 700; color: var(--gold); margin-bottom: 12px; }
.guide-steps { list-style: none; counter-reset: step; }
.guide-steps li { counter-increment: step; padding: 8px 0 8px 36px; position: relative; font-size: 14px; color: var(--text); }
.guide-steps li::before { content: counter(step); position: absolute; left: 0; top: 8px; width: 24px; height: 24px; background: var(--gold); color: #1a1a2e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

/* 兑换码卡片 */
.code-section { margin-bottom: 24px; }
.section-title { font-size: 18px; font-weight: 700; color: var(--text-bright); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.section-title .count { font-size: 12px; color: var(--text-dim); font-weight: 400; }

.code-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; transition: all 0.2s; }
.code-card:hover { border-color: var(--gold); transform: translateX(4px); }
.code-card.expired { opacity: 0.5; }
.code-info { flex: 1; min-width: 0; }
.code-value { font-family: 'Courier New', monospace; font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 1px; margin-bottom: 4px; user-select: all; }
.code-reward { font-size: 13px; color: var(--text); margin-bottom: 2px; }
.code-expire { font-size: 11px; color: var(--text-dim); }
.code-status { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
.code-status.active { background: rgba(34,197,94,0.15); color: var(--green); }
.code-status.expired { background: rgba(239,68,68,0.15); color: var(--red); }
.copy-btn { background: linear-gradient(135deg, var(--gold), var(--gold-dim)); border: none; color: #1a1a2e; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: all 0.2s; }
.copy-btn:hover { transform: scale(1.05); }
.copy-btn.copied { background: var(--green); color: #fff; }

/* 搜索框 */
.search-box { margin-bottom: 20px; }
.search-input { width: 100%; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit; }
.search-input:focus { outline: none; border-color: var(--gold); }

/* 提示 */
.tip-box { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; font-size: 13px; color: var(--text-dim); }
.tip-box strong { color: var(--gold); }

/* 响应式 */
@media (max-width: 768px) {
    .guild-nav-links { display: none; }
    .page-title { font-size: 22px; }
    .code-card { flex-wrap: wrap; }
    .code-value { font-size: 16px; }
}

/* 移动端导航栏横向滚动 */
@media (max-width: 768px) {
  .nav-inner { overflow-x: auto !important; overflow-y: hidden !important; flex-wrap: nowrap !important; -webkit-overflow-scrolling: touch !important; scrollbar-width: none !important; }
  .nav-inner::-webkit-scrollbar { display: none !important; }
  .nav-links { flex-wrap: nowrap !important; flex-shrink: 0 !important; }
  .nav-link { white-space: nowrap !important; flex-shrink: 0 !important; }
}

</style>

</head>
<body>

<nav class="guild-nav">
  <div class="guild-nav-inner">
    <div class="guild-nav-left">
      <a href="index.html"><img loading="lazy" src="guild-badge.png" alt="天涯若比邻" class="guild-logo"></a>
      <div>
        <div class="guild-nav-name">天涯若比邻</div>
        <div class="guild-nav-slogan">众志成城 · 共战神殿</div>
      </div>
    </div>
    <div class="guild-nav-links">
      <a href="index.html" class="guild-nav-link">首页</a>
      <a href="all-builds.html" class="guild-nav-link">配装</a>
      <a href="guides.html" class="guild-nav-link">攻略</a>

    </div>
    <button class="nav-icon-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">🎁 兑换码大全</h1>
    <p class="page-subtitle">英雄没有闪最新礼包码，实时更新，一键复制</p>
    <span class="update-time">最后更新：2026-09-26（官方码）</span>
  </div>

  <div class="tip-box">
    <strong>💡 提示：</strong>兑换码有时效性，建议尽快使用。每个账号只能使用一次，大小写不敏感。如果提示已过期，说明该兑换码已失效。
  </div>

  <!-- 搜索 -->
  <div class="search-box">
    <input type="text" class="search-input" placeholder="🔍 搜索兑换码或奖励..." oninput="filterCodes(this.value)">
  </div>

  <!-- 周礼包 -->
  <div class="code-section">
    <div class="section-title">📅 社区周礼包 <span class="count" id="weeklyCount"></span></div>
    <div id="weeklyCodes"></div>
  </div>

  <!-- 节日礼包 -->
  <div class="code-section">
    <div class="section-title">🎊 节日限定礼包 <span class="count" id="festivalCount"></span></div>
    <div id="festivalCodes"></div>
  </div>

  <!-- 长期有效码（折叠） -->
  <div class="code-section">
    <div class="section-title collapse-header" onclick="togglePermanent()">
      <span id="permanentArrow">▶</span> 长期有效兑换码 <span class="count" id="permanentCount"></span>
      <span style="font-size:12px;color:var(--text-dim);font-weight:normal;margin-left:8px;">（老公会基本都换过了，点击展开）</span>
    </div>
    <div id="permanentCodes" style="display:none;"></div>
  </div>
</div>

<script>
// 兑换码数据（来源：官方论坛女王洛伊丝汇总帖）
const CODES = [
  // 周礼包
  { code: '7T4b6UtRw0', reward: '社区周礼包（9.21-9.27）', expire: '即日起-2026年9月27日', active: true, type: 'weekly' },
  // 节日礼包
  { code: 'f4720Cc52r', reward: '中秋礼包（节日限定）', expire: '即日起-2026年10月1日', active: true, type: 'festival' },
  { code: '02S0k57j85', reward: '秋分礼包（节日限定）', expire: '即日起-2026年9月29日', active: true, type: 'festival' },
  // 长期有效码
  { code: 'MYS1225', reward: '新手礼包', expire: '长期有效', active: true, type: 'permanent' },
  { code: 'MYS666', reward: '活跃礼包', expire: '长期有效', active: true, type: 'permanent' },
  { code: 'MYS888', reward: '福利礼包', expire: '长期有效', active: true, type: 'permanent' },
  { code: 'VIP666', reward: '惊喜礼包', expire: '长期有效', active: true, type: 'permanent' },
  { code: 'VIP777', reward: '惊喜礼包', expire: '长期有效', active: true, type: 'permanent' },
  { code: 'VIP888', reward: '惊喜礼包', expire: '长期有效', active: true, type: 'permanent' },
];

function renderCodes(filter = '') {
  const f = filter.toLowerCase();
  
  function makeCard(c) {
    return `
      <div class="code-card ${c.active ? '' : 'expired'}">
        <div class="code-info">
          <div class="code-value">${c.code}</div>
          <div class="code-reward">🎁 ${c.reward}</div>
          <div class="code-expire">⏰ ${c.expire}</div>
        </div>
        <span class="code-status ${c.active ? 'active' : 'expired'}">${c.active ? '可用' : '已过期'}</span>
        ${c.active ? `<button class="copy-btn" onclick="copyCode('${c.code}', this)">复制</button>` : ''}
      </div>
    `;
  }
  
  function renderGroup(type, containerId, countId) {
    const items = CODES.filter(c => c.type === type && c.active && (!f || c.code.toLowerCase().includes(f) || c.reward.toLowerCase().includes(f)));
    const html = items.map(makeCard).join('');
    document.getElementById(containerId).innerHTML = html || '<p style="color:var(--text-dim);text-align:center;padding:20px;">暂无有效兑换码</p>';
    document.getElementById(countId).textContent = `(${items.length}个)`;
  }
  
  renderGroup('weekly', 'weeklyCodes', 'weeklyCount');
  renderGroup('festival', 'festivalCodes', 'festivalCount');
  renderGroup('permanent', 'permanentCodes', 'permanentCount');
}

function togglePermanent() {
  const el = document.getElementById('permanentCodes');
  const arrow = document.getElementById('permanentArrow');
  if (el.style.display === 'none') {
    el.style.display = 'block';
    arrow.textContent = '▼';
  } else {
    el.style.display = 'none';
    arrow.textContent = '▶';
  }
}

function copyCode(code, btn) {
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '已复制✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    // 降级方案
    const ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '已复制✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
  });
}

function filterCodes(val) {
  renderCodes(val);
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.querySelector('.nav-icon-btn').textContent = next === 'dark' ? '🌙' : '☀️';
}

// 初始化
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.addEventListener('DOMContentLoaded', function() {
  document.querySelector('.nav-icon-btn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
  renderCodes();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
</script>
