function toggleFullscreenSearch() {
  var el = document.getElementById('fullscreenSearch');
  el.classList.toggle('active');
  if (el.classList.contains('active')) {
    document.getElementById('fullscreenSearchInput').focus();
    document.body.style.overflow = 'hidden';
  } else {
    document.body.style.overflow = '';
  }
}

function filterBuilds(query) {
  var results = document.getElementById('searchResults');
  if (!query.trim()) { results.innerHTML = ''; return; }
  var q = query.toLowerCase();
  var matched = ALL_BUILDS.filter(function(b) {
    return b.title.toLowerCase().indexOf(q) >= 0 ||
           b.class.toLowerCase().indexOf(q) >= 0 ||
           b.source.toLowerCase().indexOf(q) >= 0 ||
           b.tags.some(function(t) { return t.toLowerCase().indexOf(q) >= 0; });
  });
  if (matched.length === 0) {
    results.innerHTML = '<div class="search-result-empty">没有找到相关配装</div>';
    return;
  }
  results.innerHTML = matched.map(function(b) {
    return '<div class="search-result-item" onclick="location.href=\'' + b.url + '\'">' +
      '<div class="search-result-title">' + b.title + '</div>' +
      '<div class="search-result-meta">' + b.class + ' · ' + b.tags.join(' / ') + ' · 出处：' + b.source + '</div>' +
      '</div>';
  }).join('');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    var el = document.getElementById('fullscreenSearch');
    if (el && el.classList.contains('active')) toggleFullscreenSearch();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    toggleFullscreenSearch();
  }
});
