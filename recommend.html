function selectOption(type, btn) {
  selections[type] = btn.dataset.value;
  // 更新按钮状态
  var container = btn.parentElement;
  container.querySelectorAll('.option-btn').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  // 检查是否全部选择
  var allSelected = selections.class && selections.usage && selections.prefer;
  var recBtn = document.getElementById('recommendBtn');
  if (allSelected) {
    recBtn.disabled = false;
    recBtn.textContent = '🎯 开始推荐';
  }
}

function doRecommend() {
  var matched = BUILD_DB.filter(function(b) {
    return b.class === selections.class;
  });
  
  // 打分
  matched.forEach(function(b) {
    b.score = 0;
    // 玩法匹配
    if (b.usage.indexOf(selections.usage) >= 0) b.score += 3;
    if (selections.usage === 'all') b.score += 2;
    // 偏好匹配
    if (b.prefer.indexOf(selections.prefer) >= 0) b.score += 2;
    // 泛用性加分
    if (b.usage.length >= 2) b.score += 1;
  });
  
  // 排序
  matched.sort(function(a, b) { return b.score - a.score; });
  
  // 取前3个
  var top3 = matched.slice(0, 3);
  
  // 渲染结果
  var html = '';
  top3.forEach(function(b, i) {
    var bestClass = i === 0 ? 'best' : '';
    var tagsHtml = b.tags.map(function(t) { return '<span class="result-tag">' + t + '</span>'; }).join('');
    html += '<div class="result-card ' + bestClass + '">' +
      '<div class="result-name">' + b.name + '</div>' +
      '<div class="result-meta">' + tagsHtml + '</div>' +
      '<div class="result-desc">' + b.desc + '</div>' +
      '<div class="result-reason">💡 推荐理由：' + b.reason + '</div>' +
      '<a href="' + b.url + '" class="result-link">查看详细配装 →</a>' +
      '</div>';
  });
  
  document.getElementById('resultList').innerHTML = html;
  document.getElementById('resultSection').classList.add('show');
  document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}

function resetAll() {
  selections = { class: null, usage: null, prefer: null };
  document.querySelectorAll('.option-btn').forEach(function(b) { b.classList.remove('selected'); });
  document.getElementById('recommendBtn').disabled = true;
  document.getElementById('recommendBtn').textContent = '请先完成以上选择';
  document.getElementById('resultSection').classList.remove('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleTheme() {
  document.body.classList.toggle('light-theme');
  var btn = document.querySelector('.nav-theme-btn');
  btn.textContent = document.body.classList.contains('light-theme') ? '☀️' : '🌙';
  localStorage.setItem('yxmys_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
}
if (localStorage.getItem('yxmys_theme') === 'light') {
  document.body.classList.add('light-theme');
  document.querySelector('.nav-theme-btn').textContent = '☀️';
}
// PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./service-worker.js').catch(function() {});
  });
}
</script>
