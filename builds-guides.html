<script>
function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));
  if(tab==='build') renderBuilds();
  if(tab==='guides') renderGuides();
}

// ===== 配装Tab逻辑 =====
let currentBuildFilter='all', buildSearchTimer=null;
function renderBuilds() {
  const grid=document.getElementById('buildGrid'),empty=document.getElementById('buildEmpty');
  const search=(document.getElementById('buildSearch').value||'').toLowerCase().trim();
  let list=BUILDS_DATA;
  if(currentBuildFilter!=='all') list=list.filter(e=>e.class===currentBuildFilter);
  if(search) list=list.filter(e=>(e.name||'').toLowerCase().includes(search)||(e.desc||'').toLowerCase().includes(search)||(e.tags||[]).some(t=>t.toLowerCase().includes(search)));
  document.getElementById('buildCount').textContent=`${list.length} 套配装`;
  if(list.length===0){grid.style.display='none';empty.style.display='block';return;}
  grid.style.display='grid';empty.style.display='none';
  grid.innerHTML=list.map(e=>`<a href="${e.url}" class="build-card" data-id="${e.id}" style="text-decoration:none;color:inherit;">
    <div class="build-icon">&#9876;</div>
    <div class="build-name">${escapeHtml(e.name)}</div>
    <span class="build-class cls-${escapeHtml(e.class)}">${e.class}</span>
    <div class="build-tags">${(e.tags||[]).map(t=>`<span class="build-tag">${escapeHtml(t)}</span>`).join('')}</div>
    <div class="build-desc-preview">${escapeHtml(e.desc).replace(/\n/g,'<br>')}</div></a>`).join('');
}
function filterBuilds(filter){currentBuildFilter=filter;document.querySelectorAll('#buildFilter .filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));renderBuilds();}

// ===== 攻略大全渲染 =====
function renderGuides(){
  if(typeof GUIDES_DATA==='undefined'||!GUIDES_DATA){
    document.getElementById('guidesCount').textContent='数据加载中...';
    document.getElementById('guidesEmpty').style.display='block';
    document.getElementById('guidesEmpty').querySelector('div:last-child').textContent='数据加载中，请刷新页面';
    document.getElementById('guidesGrid').innerHTML='';
    return;
  }
  var list = GUIDES_DATA.slice();
  var s = (document.getElementById('guidesSearch').value||'').toLowerCase();
  if(s) list = list.filter(function(g){return (g.name||'').toLowerCase().indexOf(s)>-1||(g.category||'').toLowerCase().indexOf(s)>-1||(g.desc||'').toLowerCase().indexOf(s)>-1;});
  document.getElementById('guidesCount').textContent = list.length+' 个分类';
  var empty = document.getElementById('guidesEmpty');
  var grid = document.getElementById('guidesGrid');
  if(list.length===0){empty.style.display='block';empty.querySelector('div:last-child').textContent='没有找到匹配的攻略';grid.innerHTML='';return;}
  empty.style.display='none';
  grid.innerHTML = list.map(function(g){
    var isOnline = g.status==='已上线';
    var onclick = isOnline?'onclick="window.location.href=\''+g.url+'\'"':'';
    var cls = isOnline?'guide-card':'guide-card wip';
    var statusCls = isOnline?'status-online':'status-wip';
    return '<div class="'+cls+'" '+onclick+'>'+
      '<div class="guide-icon">'+(isOnline?'&#128218;':'&#128274;')+'</div>'+
      '<div class="guide-title">'+escapeHtml(g.name)+'</div>'+
      '<div class="guide-desc">'+(g.desc?escapeHtml(g.desc):'敬请期待')+'</div>'+
      '<span class="guide-status '+statusCls+'">'+escapeHtml(g.status)+'</span>'+
    '</div>';
  }).join('');
}

// ===== 公共函数（顶部导航用） =====
function openLoginModal(){ window.location.href='admin.html'; }
function toggleTheme(){
  var body=document.body;
  if(body.dataset.theme==='light'){body.dataset.theme='dark';localStorage.setItem('theme','dark');}
  else{body.dataset.theme='light';localStorage.setItem('theme','light');}
}
function toggleFullscreenSearch(){
  var fs=document.getElementById('fullscreenSearch');
  if(!fs)return;
  if(fs.style.display==='flex'){fs.style.display='none';}
  else{fs.style.display='flex';var inp=document.getElementById('fullscreenSearchInput');if(inp)inp.focus();}
}

// ===== 主题初始化 =====
(function(){try{var t=localStorage.getItem('theme');if(t==='light')document.body.dataset.theme='light';}catch(e){}})();

// ===== 键盘事件 =====
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){var fs=document.getElementById('fullscreenSearch');if(fs)fs.style.display='none';}
  if(e.ctrlKey&&e.key==='k'){e.preventDefault();toggleFullscreenSearch();}
});

// ===== 页面初始化 =====
function initBuildsGuides(){
  var bs=document.getElementById('buildSearch');
  if(bs) bs.addEventListener('input', function(){clearTimeout(buildSearchTimer);buildSearchTimer=setTimeout(renderBuilds,300);});
  var gs=document.getElementById('guidesSearch');
  if(gs) gs.addEventListener('input', renderGuides);
  switchTab('build');
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', initBuildsGuides);
}else{
  initBuildsGuides();
}
</script>
